name: Collect BTC daily prices

on:
  schedule:
    - cron: "17 0 * * *"  # 00:17 UTC daily; GitHub may start scheduled runs some minutes late
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Re-download full history and REWRITE these series (normally: none)"
        type: choice
        options: [none, usd, zar, all]
        default: none

permissions:
  contents: write  # commit the CSVs
  actions: write   # re-enable this workflow (keepalive, see README)

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        id: collect
        env:
          REBUILD: ${{ inputs.rebuild || 'none' }}
        run: |
          args=()
          if [ "$REBUILD" != "none" ]; then args+=(--rebuild "$REBUILD"); fi
          set +e
          python -m collector "${args[@]}"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      # Commit whatever was validated and written, even if another series failed,
      # so a partial outage doesn't throw away good rows.
      - name: Commit and push changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          through=$(tail -n 1 data/btc_usd_daily.csv | cut -d, -f1)
          git commit -m "data: BTC daily prices through ${through}"
          git push || { git pull --rebase && git push; }

      - name: Keep the schedule enabled
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable"

      - name: Fail the run if the collector reported a problem
        if: steps.collect.outputs.exit_code != '0'
        run: |
          echo "::error::Collector exited with code ${{ steps.collect.outputs.exit_code }} (1 = hard failure, 2 = warnings: gaps / source behind / cross-check unavailable). See the 'Run collector' log and the job summary."
          exit 1
